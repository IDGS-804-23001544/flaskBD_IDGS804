{% extends "layout.html" %}
{% block container %}

<div class="max-w-md mx-auto mt-10 p-6 bg-white shadow-lg rounded-lg border border-gray-200">
    <h2 class="text-2xl font-semibold mb-6 text-center">Detalles del Maestro</h2>

    <div class="space-y-4">
        <div>
            <label class="block text-gray-700 font-medium">Matrícula</label>
            <input type="text" value="{{ matricula }}" readonly
                   class="w-full px-3 py-2 border rounded-md bg-gray-100 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-gray-700 font-medium">Nombre</label>
            <input type="text" value="{{ nombre }}" readonly
                   class="w-full px-3 py-2 border rounded-md bg-gray-100 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-gray-700 font-medium">Apellido Paterno</label>
            <input type="text" value="{{ apellidos }}" readonly
                   class="w-full px-3 py-2 border rounded-md bg-gray-100 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-gray-700 font-medium">Especialidad</label>
            <input type="text" value="{{ especialidad }}" readonly
                   class="w-full px-3 py-2 border rounded-md bg-gray-100 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-gray-700 font-medium">Email</label>
            <input type="text" value="{{ email }}" readonly
                   class="w-full px-3 py-2 border rounded-md bg-gray-100 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
    </div>

    <div class="flex justify-center mt-6">
        <a href="{{ url_for('maestros.index') }}"
           class="px-4 py-2 bg-gray-500 text-white font-medium rounded hover:bg-gray-600 transition-colors">
            Regresar
        </a>
    </div>
</div>

{% endblock %}
